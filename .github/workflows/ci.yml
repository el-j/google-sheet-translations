name: CI

on:
  push:
    branches: [main, develop, next]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          for i in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            echo "npm audit attempt $i failed, retrying in 5s..."
            sleep 5
          done
          # If still failing, check if it was due to registry service availability
          if npm audit --omit=dev --audit-level=high 2>&1 | grep -qE "503 Service Unavailable|ENOTFOUND|ECONNRESET|ETIMEDOUT"; then
            echo "::warning::npm registry audit endpoint unavailable (transient 5xx/network error); skipping audit failure."
            exit 0
          fi
          exit 1

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Build action bundle
        if: matrix.node-version == '22'
        run: npm run build:action

      - name: Check action bundle is up-to-date
        if: matrix.node-version == '22'
        run: |
          if ! git diff --exit-code dist-action/; then
            echo "::error::dist-action/ is out of date. Run 'npm run build:action' locally and commit the result."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Provider parity matrix
        if: matrix.node-version == '22'
        run: npm run test:provider-matrix

      - name: Integration test (public spreadsheet connectivity)
        if: matrix.node-version == '22'
        run: npm run test:integration

      - name: Upload coverage
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
