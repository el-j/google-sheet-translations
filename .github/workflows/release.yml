# Release workflow
#
# Gate: Runs only after the CI workflow succeeds on main / develop / next.
# This avoids re-running the full quality matrix inside the release workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      force_beta_prerelease:
        description: 'Force a new beta prerelease on develop even when no code commits were added.'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - develop
      - next

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    environment: 
      name: production
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    permissions:
      contents: write       # create tags + commits
      issues: write         # comment on issues
      pull-requests: write  # comment on PRs
      id-token: write       # npm provenance

    steps:
      - name: Checkout (full history required by semantic-release)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branches and tags for semantic-release
        run: |
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "Target branch: $TARGET_BRANCH"
          # Fetch and force-update tags so floating tags never cause git fetch rejection
          git fetch --tags --force --prune
          for remote in $(git branch -r | grep -v '\->'); do
            branch="${remote#origin/}"
            if [ "$branch" != "$TARGET_BRANCH" ]; then
              git branch --track "$branch" "$remote" 2>/dev/null || true
            fi
          done
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          # Ensure local tags match remote exactly
          git fetch --tags --force
          git status

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build action bundle
        run: npm run build:action

      - name: Force beta prerelease when requested
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'develop' && inputs.force_beta_prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEXT_VERSION=$(npx semver "$CURRENT_VERSION" -i prerelease --preid beta)
          echo "Current version: $CURRENT_VERSION"
          echo "Forced beta version: $NEXT_VERSION"

          npm version "$NEXT_VERSION" --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(beta): force npm beta publish [skip ci]" || true

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # Attach the compiled dist-action bundle ONLY to the release tag and floating tags,
      # so that develop and main stay 100% clean with zero bundled files in git history.
      - name: Attach action bundle to release tags
        if: steps.release.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-fetch all tags so we can see what semantic-release just created
          git fetch --tags --force
          CURRENT_REF="${{ github.event.workflow_run.head_branch || github.ref_name }}"

          # Read version from the NEWEST tag created by semantic-release.
          # We cannot use package.json here because semantic-release bumped it and
          # committed it remotely, but the workspace checkout still has the OLD version.
          TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.' | head -1)
          echo "Most recent release tag: $TAG"

          if [ -z "$TAG" ]; then
            echo "No release tag found — skipping bundle attachment."
            exit 0
          fi

          if git rev-parse "$TAG" > /dev/null 2>&1; then
            echo "Attaching dist-action bundle to $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            # Check out the tag in detached HEAD — dist-action/ is gitignored so the
            # built bundle from the previous step is still present in the workspace.
            git checkout "$TAG"
            git add -f dist-action/index.mjs
            # commit may be a no-op if nothing changed; || true so we never fail here
            git commit -m "build(action): attach action bundle for $TAG [skip ci]" || true
            git tag -fa "$TAG" -m "Release $TAG" || true
            git push origin "$TAG" --force || echo "Warning: could not force-push $TAG (may be protected or unchanged)"

            # If stable release on main, update floating major tag (e.g. v3)
            VERSION="${TAG#v}"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$CURRENT_REF" = "main" ]; then
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              echo "Updating floating tag: v${MAJOR}"
              git tag -fa "v${MAJOR}" -m "Update v${MAJOR} tag to v${VERSION}" || true
              git push origin "v${MAJOR}" --force || echo "Warning: could not force-push v${MAJOR}"
            fi

            # Return to working branch
            git checkout "$CURRENT_REF"
          fi

      # When a stable release is created on main, merge the release commit
      # (package.json + CHANGELOG.md) back into develop so develop and main
      # never diverge and stay 100% conflict-free.
      - name: Sync main release commit back to develop
        if: steps.release.outcome == 'success' && (github.event.workflow_run.head_branch == 'main' || github.ref_name == 'main')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin develop
          git checkout develop
          git merge main -m "chore(sync): back-merge release v${VERSION} into develop [skip ci]" || {
            echo "Merge conflict detected during back-merge. Preserving develop dependencies and syncing changelog..."
            git checkout --ours package.json package-lock.json 2>/dev/null || true
            git checkout --theirs CHANGELOG.md 2>/dev/null || true
            git add CHANGELOG.md package.json package-lock.json 2>/dev/null || true
            git commit -m "chore(sync): back-merge release v${VERSION} into develop (resolved) [skip ci]" || true
          }
          git push origin develop || echo "Skipping push if develop is already up to date"
