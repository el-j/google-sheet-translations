# Release workflow
#
# Gate: Runs only after the CI workflow succeeds on main / develop / next.
# This avoids re-running the full quality matrix inside the release workflow.

name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - develop
      - next

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    environment: 
      name: production
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    permissions:
      contents: write       # create tags + commits
      issues: write         # comment on issues
      pull-requests: write  # comment on PRs
      id-token: write       # npm provenance

    steps:
      - name: Checkout (full history required by semantic-release)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branches and tags for semantic-release
        run: |
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "Target branch: $TARGET_BRANCH"
          # Fetch and force-update tags so floating tags never cause git fetch rejection
          git fetch --tags --force --prune
          for remote in $(git branch -r | grep -v '\->'); do
            branch="${remote#origin/}"
            if [ "$branch" != "$TARGET_BRANCH" ]; then
              git branch --track "$branch" "$remote" 2>/dev/null || true
            fi
          done
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          # Ensure local tags match remote exactly
          git fetch --tags --force
          git status

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build action bundle
        run: npm run build:action

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # After a successful STABLE release on main, update the floating major-version tag
      # (e.g. v2) so that GitHub Action users referencing @v2 always get
      # the latest 2.x.x stable release.
      - name: Update floating major-version tag
        if: steps.release.outcome == 'success' && (github.event.workflow_run.head_branch == 'main' || github.ref_name == 'main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            echo "Stable released version: v${VERSION}"
            echo "Updating floating tag: v${MAJOR}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git tag -fa "v${MAJOR}" -m "Update v${MAJOR} tag to v${VERSION}"
            git push origin "v${MAJOR}" --force
          else
            echo "Skipping floating tag update for pre-release version v${VERSION}"
          fi

      # When a stable release is created on main, merge the release commit
      # (package.json + CHANGELOG.md) back into develop so develop and main
      # never diverge and stay 100% conflict-free.
      - name: Sync main release commit back to develop
        if: steps.release.outcome == 'success' && (github.event.workflow_run.head_branch == 'main' || github.ref_name == 'main')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin develop
          git checkout develop
          git merge main -m "chore(sync): back-merge release v${VERSION} into develop [skip ci]" || {
            echo "Merge conflict detected during back-merge. Resolving using main changes for release artifacts..."
            git checkout --theirs CHANGELOG.md package.json package-lock.json 2>/dev/null || true
            git add CHANGELOG.md package.json package-lock.json 2>/dev/null || true
            git commit -m "chore(sync): back-merge release v${VERSION} into develop (resolved) [skip ci]" || true
          }
          git push origin develop || echo "Skipping push if develop is already up to date"
