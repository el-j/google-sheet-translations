# Release workflow
#
# Gate: Runs only after the CI workflow succeeds on main / develop / next.
# This avoids re-running the full quality matrix inside the release workflow.

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - develop
      - next

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    environment: 
      name: production
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    permissions:
      contents: write       # create tags + commits
      issues: write         # comment on issues
      pull-requests: write  # comment on PRs
      id-token: write       # npm provenance

    steps:
      - name: Checkout (full history required by semantic-release)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reset to tested commit
        run: git checkout --force ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build action bundle
        run: npm run build:action

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # After a successful release, update the floating major-version tag
      # (e.g. v2) so that GitHub Action users referencing @v2 always get
      # the latest 2.x.x release.
      - name: Update floating major-version tag
        if: steps.release.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the just-released version from package.json
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          echo "Released version: v${VERSION}"
          echo "Updating floating tag: v${MAJOR}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure remote with token (persist-credentials: false above)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Force-create the major-version tag and push it
          git tag -fa "v${MAJOR}" -m "Update v${MAJOR} tag to v${VERSION}"
          git push origin "v${MAJOR}" --force
